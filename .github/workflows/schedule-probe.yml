name: Schedule Registration Probe

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm scheduled event delivery
        run: |
          echo "event=${{ github.event_name }}"
          date -u
